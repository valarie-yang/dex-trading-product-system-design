<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2800" viewBox="0 0 1440 2800">
<defs><style>
.bg{fill:#0B0D12}.p{fill:#141821;stroke:#2A3140}.p2{fill:#10141C;stroke:#344054}.w{fill:#F7F8FB}.ink{fill:#F6F7F9}.muted{fill:#AAB3C2}.dim{fill:#6F7A8C}.orange{fill:#FFB657}.cyan{fill:#4ED6C6}.blue{fill:#78A7FF}.green{fill:#77D69E}.yellow{fill:#F3C76A}.red{fill:#FF7D7D}.line{stroke:#303847}.h1{font:750 58px Inter,Arial;letter-spacing:-2px}.h2{font:700 31px Inter,Arial;letter-spacing:-.5px}.h3{font:700 20px Inter,Arial}.body{font:17px Inter,Arial}.small{font:14px Inter,Arial}.tiny{font:11px Inter,Arial}.label{font:700 12px Inter,Arial;letter-spacing:1.3px}
</style></defs>
<rect class="bg" width="1440" height="2800"/>
<text x="72" y="56" class="label cyan">CASE 02 · DEX / ASTERION PRODUCT SYSTEM</text><text x="1368" y="56" text-anchor="end" class="small muted">WEB3 DETAIL · 02 / 03</text><line x1="72" y1="80" x2="1368" y2="80" class="line"/>
<text x="72" y="156" class="label orange">PRD-LED EVIDENCE</text><text x="72" y="226" class="h1 ink">One trading shell.</text><text x="72" y="292" class="h1 ink">Truthful execution states.</text><text x="72" y="342" class="body muted">Asterion / DEX unified trading case · AMM + CLOB · Swap + Spot + Perpetual + Liquidity</text>
<rect x="930" y="135" width="438" height="220" rx="12" class="p"/><text x="960" y="174" class="label orange">THE PRODUCT THESIS</text><text x="960" y="220" class="h3 ink">Make simple mode simple</text><text x="960" y="248" class="h3 ink">without hiding material risk.</text><line x1="960" y1="270" x2="1338" y2="270" class="line"/><text x="960" y="304" class="small muted">The shell unifies navigation, not</text><text x="960" y="326" class="small muted">the mental model of every execution mode.</text>
<rect x="72" y="402" width="1296" height="690" rx="12" class="p"/><text x="102" y="440" class="label cyan">UNIFIED TRADING SHELL · SYNTHETIC PROTOTYPE FROM CANONICAL NOTION PRD</text>
<rect x="102" y="472" width="848" height="576" rx="8" fill="#111827" stroke="#2C3D5A"/><rect x="102" y="472" width="848" height="42" rx="8" fill="#182231"/><text x="128" y="498" class="tiny" fill="#C4CDDB">ASTERION · SELF-CUSTODIAL TRADING</text><circle cx="904" cy="493" r="6" fill="#77D69E"/><text x="920" y="498" class="tiny" fill="#77D69E">WALLET</text><g transform="translate(128,540)"><rect width="108" height="30" rx="5" fill="#2A3E69"/><text x="25" y="20" class="tiny ink">Swap</text><rect x="120" width="108" height="30" rx="5" fill="#18263A"/><text x="142" y="20" class="tiny muted">Perpetual</text><rect x="240" width="92" height="30" rx="5" fill="#18263A"/><text x="263" y="20" class="tiny muted">Spot</text><rect x="344" width="104" height="30" rx="5" fill="#18263A"/><text x="365" y="20" class="tiny muted">Pools</text></g><text x="128" y="620" class="h2 ink">ETH / USDC</text><text x="128" y="648" class="small muted">AMM quote · Simple mode · review before signing</text><rect x="128" y="680" width="352" height="76" rx="7" fill="#18263A"/><text x="150" y="707" class="tiny dim">YOU PAY</text><text x="150" y="734" class="h3 ink">1.00 ETH</text><text x="444" y="734" text-anchor="end" class="small muted">Balance 2.83 ETH</text><rect x="500" y="680" width="420" height="76" rx="7" fill="#18263A"/><text x="522" y="707" class="tiny dim">YOU RECEIVE</text><text x="522" y="734" class="h3 ink">3,421.20 USDC</text><text x="882" y="734" text-anchor="end" class="small muted">minimum 3,402.10</text><rect x="128" y="778" width="792" height="94" rx="7" fill="#10141C" stroke="#33445F"/><text x="150" y="806" class="tiny dim">PRE-TRADE RISK PREVIEW</text><text x="150" y="836" class="small ink">Price impact <tspan class="yellow">0.38%</tspan></text><text x="345" y="836" class="small ink">Slippage <tspan class="yellow">0.50%</tspan></text><text x="535" y="836" class="small ink">Gas <tspan class="yellow">$3.84</tspan></text><text x="710" y="836" class="small ink">Expiry <tspan class="red">00:14</tspan></text><line x1="150" y1="851" x2="898" y2="851" class="line"/><text x="150" y="866" class="tiny muted">Stale quote → refresh required before signature.</text><rect x="128" y="892" width="792" height="34" rx="6" fill="#193B38"/><text x="150" y="915" class="small green">Confirm parameters → wallet signature remains user-owned</text><text x="102" y="1072" class="tiny dim">The visual is reconstructed from the canonical DEX PRD; not a live Asterion platform screenshot.</text>
<rect x="978" y="472" width="364" height="576" rx="8" class="p2"/><text x="1006" y="514" class="label orange">PRODUCT SURFACE MAP</text><text x="1006" y="556" class="small ink">1 · Swap / AMM</text><text x="1006" y="582" class="tiny muted">simple exchange, quote freshness</text><text x="1006" y="628" class="small ink">2 · Spot / CLOB</text><text x="1006" y="654" class="tiny muted">limit / market, order depth</text><text x="1006" y="700" class="small ink">3 · Perpetual / ALP</text><text x="1006" y="726" class="tiny muted">margin, funding, liquidation</text><text x="1006" y="772" class="small ink">4 · Pools</text><text x="1006" y="798" class="tiny muted">AMM LP and ALP counterparty</text><line x1="1006" y1="830" x2="1314" y2="830" class="line"/><text x="1006" y="868" class="label cyan">UNIFIED ACCOUNT</text><text x="1006" y="906" class="small muted">same wallet context,</text><text x="1006" y="932" class="small muted">different risk and state models.</text><rect x="1006" y="966" width="278" height="34" rx="6" fill="#3A2D19"/><text x="1026" y="988" class="tiny yellow">PROGRESSIVE DISCLOSURE</text>
<g transform="translate(72,1152)"><rect width="300" height="216" rx="10" class="p2"/><text x="22" y="36" class="label orange">MY ROLE</text><text x="22" y="72" class="small ink">Own user journeys, product</text><text x="22" y="98" class="small ink">rules, risk UX and UAT logic.</text><text x="22" y="150" class="label dim">RESULT</text><text x="22" y="178" class="small muted">One shell, truthful modes.</text><rect x="324" width="300" height="216" rx="10" class="p2"/><text x="346" y="36" class="label cyan">INPUTS</text><text x="346" y="72" class="small ink">Pair + balance + quote</text><text x="346" y="98" class="small ink">gas + slippage + expiry</text><text x="346" y="150" class="label dim">OUTPUTS</text><text x="346" y="178" class="small muted">Preview + next state + recovery.</text><rect x="648" width="300" height="216" rx="10" class="p2"/><text x="670" y="36" class="label blue">DECISION</text><text x="670" y="72" class="small ink">Show risk before the user</text><text x="670" y="98" class="small ink">enters an irreversible step.</text><text x="670" y="150" class="label dim">AI BOUNDARY</text><text x="670" y="178" class="small muted">Explain flags; never execute.</text><rect x="972" width="396" height="216" rx="10" class="p2"/><text x="994" y="36" class="label red">NOT CLAIMED</text><text x="994" y="72" class="small muted">matching engine · market making</text><text x="994" y="98" class="small muted">smart-contract engineering</text><text x="994" y="124" class="small muted">keys · signing · broadcasting</text><text x="994" y="178" class="tiny dim">/dex-trading-product-system-design</text></g>
<line x1="72" y1="1450" x2="1368" y2="1450" class="line"/><text x="72" y="1500" class="label cyan">STATE AND RISK MODEL</text><text x="72" y="1552" class="h2 ink">The “trade” is a sequence of accountable states</text><g transform="translate(72,1590)"><rect width="190" height="80" rx="8" class="p"/><text x="22" y="32" class="label yellow">01</text><text x="22" y="58" class="small ink">Quote / order draft</text><line x1="190" y1="40" x2="224" y2="40" class="line"/><rect x="224" width="190" height="80" rx="8" class="p"/><text x="246" y="32" class="label cyan">02</text><text x="246" y="58" class="small ink">Preview + approval</text><line x1="414" y1="40" x2="448" y2="40" class="line"/><rect x="448" width="190" height="80" rx="8" class="p"/><text x="470" y="32" class="label blue">03</text><text x="470" y="58" class="small ink">Signature / submit</text><line x1="638" y1="40" x2="672" y2="40" class="line"/><rect x="672" width="190" height="80" rx="8" class="p"/><text x="694" y="32" class="label orange">04</text><text x="694" y="58" class="small ink">Pending / matching</text><line x1="862" y1="40" x2="896" y2="40" class="line"/><rect x="896" width="210" height="80" rx="8" class="p"/><text x="918" y="32" class="label green">05</text><text x="918" y="58" class="small ink">Fill / settle / fail</text></g><rect x="72" y="1720" width="1296" height="280" rx="12" class="p"/><text x="102" y="1762" class="label orange">ASTERION-SPECIFIC INSIGHTS FROM THE PRD</text><text x="102" y="1810" class="small ink">• Four product surfaces need one navigational shell but separate mental models: Swap, Spot, Perpetual and Pools.</text><text x="102" y="1848" class="small ink">• AMM and ALP liquidity are not the same: spot LP exposure differs from perpetual counterparty exposure.</text><text x="102" y="1886" class="small ink">• UTA can simplify account context; it must not hide margin, leverage, funding or liquidation consequences.</text><text x="102" y="1924" class="small ink">• Reduce-only, circuit-breaker and oracle-failure states belong in the product experience, not only in backend rules.</text><text x="102" y="1962" class="tiny muted">All thresholds and outcomes remain proposed PRD logic, not measured production results.</text>
<line x1="72" y1="2070" x2="1368" y2="2070" class="line"/><text x="72" y="2120" class="label green">RECRUITER WALKTHROUGH · 2 MINUTES</text><text x="72" y="2170" class="body muted">Start with the unified shell. Ask: what changes between Swap, Spot and Perpetual? Show the risk preview,</text><text x="72" y="2200" class="body muted">then walk the state machine from quote to settlement. Close with what the AI may explain—and what it can never execute.</text><text x="72" y="2266" class="small muted">Evidence level: PRD-led product/system design · synthetic prototype · canonical Notion source verified</text><text x="72" y="2310" class="mono cyan">github.com/valarie-yang/dex-trading-product-system-design</text><text x="72" y="2350" class="mono dim">Notion: DEX Unified Trading Platform — Canonical Product Case · Asterion DEX PRD full 102</text>
</svg>
